name: Deploy EC2

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend tests
        working-directory: backend
        run: mvn -B test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint/build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    needs: quality-gates
    runs-on: ubuntu-latest
    environment: production
    env:
      EC2_HOST_RAW: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
    steps:
      - name: Check required secrets are present
        run: |
          test -n "${EC2_HOST_RAW}" || (echo "EC2_HOST missing"; exit 1)
          test -n "${EC2_USER}" || (echo "EC2_USER missing"; exit 1)
          test -n "${EC2_SSH_PRIVATE_KEY}" || (echo "EC2_SSH_PRIVATE_KEY missing"; exit 1)

      - name: Normalize EC2 host
        id: normalize_host
        run: |
          EC2_HOST_CLEAN="$(printf "%s" "${EC2_HOST_RAW}" | tr -d '\r\n\t ')"
          if [[ -z "${EC2_HOST_CLEAN}" ]]; then
            echo "EC2_HOST resolved empty after trimming. Re-save secret as plain host/IP only."
            exit 1
          fi
          if [[ "${EC2_HOST_CLEAN}" =~ ^https?:// ]]; then
            echo "EC2_HOST must not include http:// or https://"
            exit 1
          fi
          echo "ec2_host=${EC2_HOST_CLEAN}" >> "$GITHUB_OUTPUT"

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.normalize_host.outputs.ec2_host }}
          username: ${{ env.EC2_USER }}
          key: ${{ env.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /opt/naqlaAI
            git pull --ff-only origin main
            chmod +x deploy/ec2/deploy.sh
            ./deploy/ec2/deploy.sh
